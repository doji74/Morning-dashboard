name: Morgen-Dashboard

# Ziel: Mo–Fr um 04:15 Uhr deutscher Zeit (Europe/Berlin).
# GitHub-Cron läuft immer in UTC und kennt keine Sommerzeit:
#   Winterzeit (MEZ  = UTC+1): 04:15 Berlin = 03:15 UTC
#   Sommerzeit (MESZ = UTC+2): 04:15 Berlin = 02:15 UTC
# GitHub startet geplante Läufe oft stark verspätet (beobachtet: bis zu 8 Stunden).
# Deshalb gibt es weitere Einträge als Reserve. Der Job "zeitcheck" baut nur,
# wenn es in Berlin zwischen 04:00 und 22:59 Uhr ist UND die Seite heute noch
# nicht gebaut wurde. So gibt es genau einen Build (und einen Push) pro Werktag,
# auch wenn GitHub sich verspätet.
on:
  schedule:
    - cron: "15 2 * * 1-5"   # 04:15 Sommerzeit / 03:15 Winterzeit (zu früh -> übersprungen)
    - cron: "15 3 * * 1-5"   # 04:15 Winterzeit / 05:15 Sommerzeit
    - cron: "45 3 * * 1-5"   # Reserve
    - cron: "15 5 * * 1-5"   # Reserve
  workflow_dispatch:          # manuell starten (Actions -> Morgen-Dashboard -> Run workflow)
    inputs:
      notify:
        description: "Push-Nachricht per ntfy senden?"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morgen-dashboard
  cancel-in-progress: false

jobs:
  zeitcheck:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          TODAY=$(TZ=Europe/Berlin date +%F)
          HOUR=$((10#$(TZ=Europe/Berlin date +%H)))
          echo "Berlin: $(TZ=Europe/Berlin date '+%a %d.%m.%Y %H:%M %Z') | Auslöser: $EVENT '$SCHEDULE'"
          if [ "$EVENT" != "schedule" ]; then
            echo "Manueller Start – läuft immer."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -lt 4 ] || [ "$HOUR" -gt 22 ]; then
            echo "Außerhalb von 04:00–22:59 Uhr – übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Wurde heute schon gebaut? Stand der veröffentlichten Seite prüfen.
          GENERATED=$(curl -fsSL --max-time 20 "$DATA_URL?nocache=$(date +%s)" \
                      | jq -r '.generated // empty' 2>/dev/null || true)
          echo "Veröffentlichter Stand: ${GENERATED:-unbekannt}"
          if [[ "$GENERATED" == "$TODAY"* ]]; then
            echo "Heute schon gebaut – übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Heute noch nicht gebaut – los geht's."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  dashboard:
    needs: zeitcheck
    if: needs.zeitcheck.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20        # ein Lauf dauert normalerweise 1–2 Minuten
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Dashboard bauen (data.json + index.html)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: KI-Kurzfassungen
        run: python build_dashboard.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push-Nachricht per ntfy (lautlos)
        if: github.event_name == 'schedule' || inputs.notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python notify.py --data site/data.json
